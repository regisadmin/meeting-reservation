<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบจองห้องประชุมออนไลน์</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      font-family: 'Prompt', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen flex flex-col">

  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow flex items-center justify-center">
          <i data-lucide="calendar-check" class="w-6 h-6"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg sm:text-xl text-slate-900 leading-tight">ระบบจองห้องประชุม</h1>
          <p class="text-xs text-slate-500 hidden sm:block">ตรวจสอบปฏิทินห้องว่างและบันทึกการขอใช้งาน</p>
        </div>
      </div>

      <button onclick="openBookingModal()" class="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 active:scale-95 text-white font-medium px-4 py-2 sm:px-5 sm:py-2.5 rounded-xl shadow transition">
        <i data-lucide="plus-circle" class="w-5 h-5"></i>
        <span class="text-sm sm:text-base">จองห้องประชุม</span>
      </button>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 flex-1 w-full space-y-6">

    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
      <div class="p-4 sm:p-5 border-b border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-3 bg-slate-50/50">
        <div class="flex items-center gap-2.5">
          <div class="p-2 bg-indigo-50 text-indigo-600 rounded-lg">
            <i data-lucide="map" class="w-5 h-5"></i>
          </div>
          <div>
            <h2 class="font-bold text-base sm:text-lg text-slate-900">แผนผังที่ตั้งห้องประชุม</h2>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <label class="cursor-pointer inline-flex items-center gap-1.5 bg-white hover:bg-slate-100 border border-slate-300 text-slate-700 text-xs font-medium px-3 py-1.5 rounded-lg shadow-sm transition">
            <i data-lucide="upload" class="w-3.5 h-3.5"></i>
            เปลี่ยนรูปแผนผัง
            <input type="file" accept="image/*" class="hidden" onchange="handleFloorPlanUpload(event)">
          </label>
          <button onclick="promptFloorPlanUrl()" class="inline-flex items-center gap-1.5 bg-white hover:bg-slate-100 border border-slate-300 text-slate-700 text-xs font-medium px-3 py-1.5 rounded-lg shadow-sm transition">
            <i data-lucide="link" class="w-3.5 h-3.5"></i>
            ใส่ URL รูป
          </button>
        </div>
      </div>

      <div class="p-4 bg-slate-100/50 flex items-center justify-center">
        <div class="w-full rounded-xl overflow-hidden border border-slate-200 bg-white flex items-center justify-center min-h-[260px] max-h-[460px]">
          <img id="floorPlanImage" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='716' height='400' viewBox='0 0 716 400' fill='none'><rect width='716' height='400' fill='%23F8FAFC'/><rect x='50' y='50' width='616' height='300' rx='12' fill='%23EEF2FF' stroke='%236366F1' stroke-width='2' stroke-dasharray='6 6'/><text x='358' y='190' font-family='sans-serif' font-size='20' fill='%234338CA' text-anchor='middle' font-weight='bold'>แผนผังห้องประชุม (ตัวอย่าง)</text><text x='358' y='220' font-family='sans-serif' font-size='14' fill='%2364748B' text-anchor='middle'>กดปุ่มด้านบนเพื่ออัปโหลดรูปแผนผังของคุณ</text></svg>" alt="แผนผังห้องประชุม" class="w-full h-auto max-h-[440px] object-contain">
        </div>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="roomContainer">
      </div>

    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-4 sm:p-6">
      <h3 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
        <i data-lucide="calendar" class="w-5 h-5 text-indigo-600"></i>
        ตารางการใช้งานห้องประชุม
      </h3>
      <div class="w-full h-[500px] rounded-xl overflow-hidden border border-slate-200 bg-slate-50 flex items-center justify-center">
        <p class="text-slate-400 text-sm">ส่วนแสดงผล Google Calendar หรือระบบตารางนัดหมาย</p>
      </div>
    </div>

  </main>

  <script>
    // ข้อมูลห้องประชุมตัวอย่าง
    const rooms = [
      { id: 1, name: "ห้องประชุมใหญ่ (Grand Hall)", capacity: "50-100 คน", status: "ว่าง", color: "emerald" },
      { id: 2, name: "ห้องประชุมกลาง (Meeting Room A)", capacity: "15-30 คน", status: "ว่าง", color: "emerald" },
      { id: 3, name: "ห้องประชุมเล็ก (Executive Room)", capacity: "5-10 คน", status: "ใช้งานอยู่", color: "rose" }
    ];

    function renderRooms() {
      const container = document.getElementById('roomContainer');
      if(!container) return;
      container.innerHTML = rooms.map(room => `
        <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between hover:border-indigo-200 transition">
          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="font-bold text-slate-900">${room.name}</span>
              <span class="text-xs px-2.5 py-1 rounded-full font-medium ${room.color === 'emerald' ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}">
                ${room.status}
              </span>
            </div>
            <p class="text-xs text-slate-500 mb-4 flex items-center gap-1">
              <i data-lucide="users" class="w-3.5 h-3.5"></i> รองรับได้ ${room.capacity}
            </p>
          </div>
          <button onclick="openBookingModal(${room.id})" class="w-full py-2 bg-slate-100 hover:bg-indigo-600 hover:text-white text-slate-700 text-sm font-medium rounded-lg transition">
            เลือกห้องนี้
          </button>
        </div>
      `).join('');
      lucide.createIcons();
    }

    function openBookingModal(roomId) {
      alert('เปิดฟอร์มจองห้องประชุม ' + (roomId ? 'หมายเลข ' + roomId : ''));
    }

    function handleFloorPlanUpload(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById('floorPlanImage').src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    function promptFloorPlanUrl() {
      const url = prompt("กรุณาใส่ URL ของรูปภาพแผนผัง:");
      if (url) {
        document.getElementById('floorPlanImage').src = url;
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      renderRooms();
    });
  </script>
</body>
</html>
